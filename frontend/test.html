<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test - PrepDOC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f7ff; color: #1a1a2e; }
        .container { max-width: 850px; margin: 0 auto; padding: 1.5rem 1.2rem; }

        .test-header {
            background: #fff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 2.5px solid #94a3b8;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .test-header .left { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .test-header .left .back-link { color: #475569; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .test-header .left .back-link:hover { color: #0ea5e9; }
        .test-header .left .title { font-weight: 700; font-size: 1.1rem; }
        .test-header .left .info { font-size: 0.85rem; color: #64748b; }
        .test-header .timer { 
            font-size: 1.8rem; 
            font-weight: 700; 
            color: #0ea5e9;
            min-width: 120px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .test-header .timer.warning { color: #dc2626; animation: blink 0.5s ease infinite alternate; }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        .cbt-progress {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin: 1rem 0;
        }
        .cbt-progress .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2.5px solid #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
        }
        .cbt-progress .dot:hover { border-color: #0ea5e9; color: #0ea5e9; }
        .cbt-progress .dot.active { border-color: #0ea5e9; background: #f0f9ff; color: #0ea5e9; }
        .cbt-progress .dot.answered { border-color: #0ea5e9; background: #0ea5e9; color: #fff; }
        .cbt-progress .dot.review-correct { border-color: #16a34a; background: #16a34a; color: #fff; }
        .cbt-progress .dot.review-wrong { border-color: #dc2626; background: #dc2626; color: #fff; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: #0ea5e9;
            border-radius: 10px;
            transition: width 0.3s;
        }

        .cbt-question-card {
            background: #fff;
            border-radius: 16px;
            padding: 2rem;
            border: 2.5px solid #94a3b8;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .cbt-question-card:hover {
            border-color: #64748b;
        }
        .cbt-question-card .q-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        .cbt-question-card .q-text .q-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            background: #dbeafe;
            color: #0ea5e9;
            padding: 2px 12px;
            border-radius: 50px;
            margin-right: 0.5rem;
        }

        .q-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            padding: 4px;
            margin: 0.5rem 0 1rem 0;
            display: block;
        }

        .cbt-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }
        @media (max-width: 600px) {
            .cbt-options { grid-template-columns: 1fr; }
        }

        .cbt-option {
            padding: 0.8rem 1.2rem;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            background: #fafbfc;
        }
        .cbt-option:hover {
            border-color: #64748b;
            background: #f1f5f9;
        }
        .cbt-option .opt-label {
            font-weight: 700;
            color: #64748b;
            min-width: 24px;
        }
        .cbt-option.selected {
            border-color: #0ea5e9;
            background: #f0f9ff;
        }
        .cbt-option.disabled {
            cursor: default;
            opacity: 0.7;
        }
        .cbt-option .opt-icon {
            margin-left: auto;
            font-size: 1.1rem;
        }

        .cbt-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.6rem 1.8rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
        .btn-primary { background: #0ea5e9; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #0284c7; transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 2px solid #cbd5e1; color: #475569; }
        .btn-outline:hover:not(:disabled) { border-color: #0ea5e9; color: #0ea5e9; }
        .btn-success { background: #16a34a; color: #fff; }
        .btn-success:hover:not(:disabled) { background: #15803d; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #b91c1c; }

        .result-box {
            background: #fff;
            border-radius: 16px;
            padding: 2.5rem;
            border: 2.5px solid #94a3b8;
            text-align: center;
            margin-top: 1rem;
        }
        .result-box .big-score {
            font-size: 4.5rem;
            font-weight: 800;
            color: #0ea5e9;
            line-height: 1;
        }
        .result-box .big-score .percent { font-size: 1.5rem; }
        .result-box .score-label { font-size: 1rem; color: #64748b; margin-top: 0.2rem; }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }
        .result-stats .stat-item { text-align: center; }
        .result-stats .stat-item .num { font-size: 2.2rem; font-weight: 700; }
        .result-stats .stat-item .num.green { color: #16a34a; }
        .result-stats .stat-item .num.red { color: #dc2626; }
        .result-stats .stat-item .num.gray { color: #94a3b8; }
        .result-stats .stat-item .label { color: #64748b; font-size: 0.85rem; }

        .result-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .review-section {
            margin-top: 2rem;
            text-align: left;
        }
        .review-section .review-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .review-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #94a3b8;
        }
        .review-item.correct { border-left-color: #16a34a; background: #f0fdf4; }
        .review-item.wrong { border-left-color: #dc2626; background: #fef2f2; }
        .review-item .r-q { font-weight: 600; margin-bottom: 0.3rem; }
        .review-item .r-answer { font-size: 0.9rem; }
        .review-item .r-answer .right { color: #16a34a; font-weight: 700; }
        .review-item .r-answer .wrong { color: #dc2626; font-weight: 700; }
        .review-item .r-explain {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #475569;
            padding: 0.5rem 0.8rem;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .review-item .r-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            margin-top: 0.5rem;
        }

        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .container { padding: 1rem 0.8rem; }
            .cbt-question-card { padding: 1.2rem; }
            .test-header { flex-direction: column; text-align: center; }
            .test-header .left { justify-content: center; }
            .test-header .timer { text-align: center; min-width: auto; }
            .result-box .big-score { font-size: 3rem; }
            .result-stats { gap: 1.2rem; }
            .result-stats .stat-item .num { font-size: 1.6rem; }
            .cbt-nav .btn { padding: 0.5rem 1.2rem; font-size: 0.8rem; }
            .review-item { padding: 0.8rem 1rem; }
            .cbt-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== TEST HEADER ===== -->
        <div class="test-header">
            <div class="left">
                <a href="javascript:history.back()" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
                <span class="title" id="testTitle">Loading Test...</span>
                <span class="info" id="testInfo">0 Questions</span>
                <span class="info" id="questionCounter" style="font-weight:700;color:#0ea5e9;"></span>
            </div>
            <div class="timer" id="timer">⏱️ 00:00</div>
        </div>

        <!-- ===== PROGRESS BAR ===== -->
        <div class="progress-bar">
            <div class="fill" id="progressFill" style="width:0%"></div>
        </div>

        <!-- ===== PROGRESS DOTS ===== -->
        <div class="cbt-progress" id="progressDots"></div>

        <!-- ===== QUESTION ===== -->
        <div id="questionContainer">
            <div class="cbt-question-card">
                <div class="q-text" id="qText">Loading question...</div>
                <div class="cbt-options" id="optionsContainer"></div>
            </div>

            <div class="cbt-nav">
                <button class="btn btn-outline" id="prevBtn" onclick="prevQuestion()">
                    <i class="fas fa-arrow-left"></i> Previous
                </button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">
                    Next <i class="fas fa-arrow-right"></i>
                </button>
                <button class="btn btn-success" id="submitBtn" onclick="submitTest()">
                    <i class="fas fa-check"></i> Submit
                </button>
            </div>
        </div>

        <!-- ===== RESULT / SCORECARD ===== -->
        <div class="result-box hidden" id="resultBox">
            <div class="big-score" id="scoreDisplay">0<span class="percent">%</span></div>
            <div class="score-label">Your Score</div>

            <div class="result-stats" id="resultStats">
                <div class="stat-item">
                    <div class="num green" id="correctCount">0</div>
                    <div class="label">✅ Correct</div>
                </div>
                <div class="stat-item">
                    <div class="num red" id="wrongCount">0</div>
                    <div class="label">❌ Wrong</div>
                </div>
                <div class="stat-item">
                    <div class="num gray" id="unattemptedCount">0</div>
                    <div class="label">⏭️ Unattempted</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="totalCount" style="color:#64748b;">0</div>
                    <div class="label">📝 Total</div>
                </div>
            </div>

            <div class="result-actions">
                <button class="btn btn-primary" onclick="window.location.reload()">🔄 Retry</button>
                <button class="btn btn-outline" onclick="window.location.href='index.html'">🏠 Home</button>
            </div>

            <!-- Review Section -->
            <div class="review-section" id="reviewSection">
                <div class="review-title"><i class="fas fa-list-ul"></i> Detailed Review</div>
                <div id="reviewContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://prepdoc-api.onrender.com/api';
        const urlParams = new URLSearchParams(window.location.search);
        const testId = urlParams.get('id');
        const testType = urlParams.get('type');

        let questions = [];
        let currentIndex = 0;
        let answers = {};
        let timerInterval;
        let seconds = 0;
        let isSubmitted = false;

        // ============================================
        // ===== BUILD QUESTION DISPLAY =====
        // ============================================
        function buildQuestionHTML(q) {
            if (q.question_type === 'assertion_reason') {
                return `
                    <div class="ar-box" style="background:#f8fafc;border-radius:10px;padding:0.8rem 1rem;margin:0.4rem 0;border-left:4px solid #7c3aed;font-size:1rem;line-height:1.5;">
                        <div class="label" style="font-weight:700;color:#7c3aed;font-size:0.9rem;">Assertion (A):</div>
                        <div class="text" style="margin-top:0.1rem;font-size:1rem;">${q.assertion || 'Assertion not available'}</div>
                    </div>
                    <div class="ar-box" style="background:#f8fafc;border-radius:10px;padding:0.8rem 1rem;margin:0.4rem 0;border-left:4px solid #db2777;font-size:1rem;line-height:1.5;">
                        <div class="label" style="font-weight:700;color:#db2777;font-size:0.9rem;">Reason (R):</div>
                        <div class="text" style="margin-top:0.1rem;font-size:1rem;">${q.reason || 'Reason not available'}</div>
                    </div>
                `;
            }
            else if (q.question_type === 'statement') {
                return `
                    <div class="statement-box" style="background:#f8fafc;border-radius:10px;padding:0.8rem 1rem;margin:0.4rem 0;border-left:4px solid #0ea5e9;font-size:1rem;line-height:1.5;">
                        <div class="label" style="font-weight:700;color:#0ea5e9;font-size:0.9rem;">Statement I:</div>
                        <div class="text" style="margin-top:0.1rem;font-size:1rem;">${q.statement_1 || 'Statement I not available'}</div>
                    </div>
                    <div class="statement-box" style="background:#f8fafc;border-radius:10px;padding:0.8rem 1rem;margin:0.4rem 0;border-left:4px solid #db2777;font-size:1rem;line-height:1.5;">
                        <div class="label" style="font-weight:700;color:#db2777;font-size:0.9rem;">Statement II:</div>
                        <div class="text" style="margin-top:0.1rem;font-size:1rem;">${q.statement_2 || 'Statement II not available'}</div>
                    </div>
                `;
            }
            else {
                return q.question_text || '';
            }
        }

        // ============================================
        // ===== LOAD TEST =====
        // ============================================
        async function loadTest() {
            const chapterQuestions = sessionStorage.getItem('chapterTestQuestions');
            if (testType === 'chapter' && chapterQuestions) {
                questions = JSON.parse(chapterQuestions);
                const chapter = urlParams.get('chapter') || 'Chapter';
                const subject = urlParams.get('subject') || '';
                document.getElementById('testTitle').textContent = `📖 ${subject ? subject.charAt(0).toUpperCase() + subject.slice(1) + ' - ' : ''}${chapter}`;
                document.getElementById('testInfo').textContent = `${questions.length} Questions`;
                if (questions.length === 0) {
                    document.getElementById('questionContainer').innerHTML = '<p style="text-align:center;color:#dc2626;">❌ No questions found.</p>';
                    return;
                }
                // ✅ Set default timer for chapter tests
                seconds = 30 * 60; // 30 minutes default
                startTest();
                return;
            }

            const pyqQuestions = sessionStorage.getItem('pyqQuestions');
            if (testType === 'pyq' && pyqQuestions) {
                questions = JSON.parse(pyqQuestions);
                const chapter = urlParams.get('chapter') || 'PYQs';
                document.getElementById('testTitle').textContent = `📜 PYQs: ${chapter}`;
                document.getElementById('testInfo').textContent = `${questions.length} Questions`;
                if (questions.length === 0) {
                    document.getElementById('questionContainer').innerHTML = '<p style="text-align:center;color:#dc2626;">❌ No questions found.</p>';
                    return;
                }
                seconds = 30 * 60;
                startTest();
                return;
            }

            if (!testId) {
                document.getElementById('questionContainer').innerHTML = '<p style="text-align:center;color:#dc2626;">❌ No test ID provided.</p>';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/tests/${testId}`);
                const data = await response.json();
                if (response.status === 404) {
                    document.getElementById('questionContainer').innerHTML = '<p style="text-align:center;color:#dc2626;">❌ Test not found.</p>';
                    return;
                }
                document.getElementById('testTitle').textContent = data.title || 'Test';
                document.getElementById('testInfo').textContent = `${data.question_count || data.questions?.length || 0} Questions`;
                questions = data.questions || [];
                if (questions.length === 0) {
                    document.getElementById('questionContainer').innerHTML = '<p style="text-align:center;color:#dc2626;">❌ No questions found for this test.</p>';
                    return;
                }
                
                // ✅ TIMER - Get duration from test data
                let timerMinutes = 30; // default
                console.log('📝 Duration from DB:', data.duration);
                
                if (data.duration) {
                    const durationStr = data.duration;
                    const match = durationStr.match(/(\d+)/);
                    if (match) {
                        timerMinutes = parseInt(match[1]);
                        console.log(`⏱️ Timer set to ${timerMinutes} minutes`);
                    }
                } else {
                    console.log('⏱️ No duration in DB, using default 30 minutes');
                }
                
                seconds = timerMinutes * 60;
                console.log(`⏱️ Total seconds: ${seconds}`);
                
                startTest();
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('questionContainer').innerHTML = '<p style="text-align:center;color:#dc2626;">❌ Error loading test. Please try again.</p>';
            }
        }

        // ============================================
        // ===== START TEST =====
        // ============================================
        function startTest() {
            currentIndex = 0;
            answers = {};
            isSubmitted = false;
            renderQuestion();
            
            // ✅ Timer start
            if (seconds > 0) {
                console.log(`⏱️ Starting timer with ${seconds} seconds`);
                updateTimer();
                timerInterval = setInterval(() => {
                    seconds--;
                    updateTimer();
                    if (seconds <= 0) {
                        clearInterval(timerInterval);
                        submitTest();
                    }
                }, 1000);
            } else {
                document.getElementById('timer').textContent = '⏱️ No Timer';
                console.log('⏱️ No timer set');
            }
        }

        function updateTimer() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const timer = document.getElementById('timer');
            timer.textContent = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (seconds < 60) timer.classList.add('warning');
            else timer.classList.remove('warning');
        }

        // ============================================
        // ===== RENDER QUESTION =====
        // ============================================
        function renderQuestion() {
            if (isSubmitted) return;
            const q = questions[currentIndex];
            if (!q) return;

            const total = questions.length;
            
            document.getElementById('questionCounter').textContent = `Question ${currentIndex + 1} of ${total}`;
            
            let questionHtml = buildQuestionHTML(q);
            
            let imageHtml = '';
            if (q.image_data) {
                imageHtml = `<img src="${q.image_data}" alt="Question Image" class="q-image" />`;
            }
            
            document.getElementById('qText').innerHTML = `
                <span class="q-tag">${q.difficulty || 'Medium'}</span>
                <div style="margin-top: 0.5rem;">${questionHtml}</div>
                ${imageHtml}
            `;
            
            document.getElementById('progressFill').style.width = `${((currentIndex + 1) / total) * 100}%`;

            const labels = ['A', 'B', 'C', 'D'];
            const options = [q.option_a, q.option_b, q.option_c, q.option_d];

            const container = document.getElementById('optionsContainer');
            container.innerHTML = labels.map((label, idx) => {
                const optionText = options[idx] || 'N/A';
                const isSelected = answers[q.id] === label;
                return `
                    <div class="cbt-option ${isSelected ? 'selected' : ''}" 
                         onclick="selectOption(${q.id}, '${label}')">
                        <span class="opt-label">${label}</span>
                        <span>${optionText}</span>
                        <span class="opt-icon">${isSelected ? '✓' : ''}</span>
                    </div>
                `;
            }).join('');

            const dotsContainer = document.getElementById('progressDots');
            dotsContainer.innerHTML = questions.map((_, i) => {
                let cls = 'dot';
                if (i === currentIndex) cls += ' active';
                if (answers[questions[i].id]) cls += ' answered';
                return `<div class="${cls}" onclick="goToQuestion(${i})">${i+1}</div>`;
            }).join('');

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').textContent = currentIndex === total - 1 ? 'Finish' : 'Next →';
        }

        function selectOption(qId, label) {
            if (isSubmitted) return;
            answers[qId] = label;
            renderQuestion();
        }

        function goToQuestion(index) {
            if (isSubmitted) return;
            if (index >= 0 && index < questions.length) {
                currentIndex = index;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (isSubmitted) return;
            if (currentIndex === questions.length - 1) {
                submitTest();
                return;
            }
            currentIndex++;
            renderQuestion();
        }

        function prevQuestion() {
            if (isSubmitted) return;
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        async function submitTest() {
            if (isSubmitted) return;
            isSubmitted = true;
            clearInterval(timerInterval);

            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login to submit test');
                window.location.href = 'login.html';
                return;
            }

            const attempted = Object.keys(answers).length;
            if (attempted < questions.length) {
                if (!confirm(`You have attempted ${attempted} out of ${questions.length} questions. Submit anyway?`)) {
                    isSubmitted = false;
                    return;
                }
            }

            if (testType === 'chapter') {
                showResult(calculateResult());
                sessionStorage.removeItem('chapterTestQuestions');
                return;
            }

            if (testType === 'pyq') {
                showResult(calculateResult());
                sessionStorage.removeItem('pyqQuestions');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/tests/${testId}/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ answers })
                });

                const data = await response.json();
                if (response.ok) {
                    showResult(data);
                } else {
                    alert(data.error || 'Failed to submit test');
                    isSubmitted = false;
                }
            } catch (err) {
                alert('Error submitting test. Please try again.');
                isSubmitted = false;
            }
        }

        function calculateResult() {
            let correct = 0, wrong = 0, unattempted = 0;
            const details = [];
            questions.forEach(q => {
                const userAns = answers[q.id] || null;
                const isCorrect = userAns === q.correct_answer;
                if (userAns === null || userAns === undefined) {
                    unattempted++;
                } else if (isCorrect) {
                    correct++;
                } else {
                    wrong++;
                }
                details.push({
                    questionId: q.id,
                    correctAnswer: q.correct_answer,
                    userAnswer: userAns || 'Not attempted',
                    isCorrect: userAns ? isCorrect : false
                });
            });
            const total = questions.length;
            const percentage = ((correct / total) * 100).toFixed(1);
            return { total, correct, wrong, unattempted, percentage, details };
        }

        function showResult(data) {
            document.getElementById('questionContainer').classList.add('hidden');
            document.getElementById('resultBox').classList.remove('hidden');

            document.getElementById('scoreDisplay').innerHTML = `${data.percentage}<span class="percent">%</span>`;
            document.getElementById('correctCount').textContent = data.correct || 0;
            document.getElementById('wrongCount').textContent = data.wrong || 0;
            document.getElementById('unattemptedCount').textContent = data.unattempted || (data.total - data.correct - data.wrong);
            document.getElementById('totalCount').textContent = data.total || questions.length;
            document.getElementById('timer').textContent = '⏱️ Done';

            const container = document.getElementById('reviewContainer');
            const details = data.details || [];
            let html = '';
            questions.forEach((q, i) => {
                const detail = details[i] || {};
                const userAns = detail.userAnswer || 'Not attempted';
                const isCorrect = detail.isCorrect;
                const correctAns = detail.correctAnswer || 'N/A';
                const cls = isCorrect ? 'correct' : 'wrong';
                
                let reviewQuestion = q.question_text || '';
                if (q.question_type === 'assertion_reason') {
                    reviewQuestion = `Assertion: ${q.assertion || 'N/A'} | Reason: ${q.reason || 'N/A'}`;
                } else if (q.question_type === 'statement') {
                    reviewQuestion = `Statement I: ${q.statement_1 || 'N/A'} | Statement II: ${q.statement_2 || 'N/A'}`;
                }
                
                let reviewImageHtml = '';
                if (q.image_data) {
                    reviewImageHtml = `<img src="${q.image_data}" alt="Question Image" class="r-image" />`;
                }
                
                html += `
                    <div class="review-item ${cls}">
                        <div class="r-q">Q${i+1}. ${reviewQuestion}</div>
                        ${reviewImageHtml}
                        <div class="r-answer">
                            Your Answer: <span class="${isCorrect ? 'right' : 'wrong'}">${userAns}</span>
                            ${!isCorrect && userAns !== 'Not attempted' ? ` (Correct: <span class="right">${correctAns}</span>)` : ''}
                            ${userAns === 'Not attempted' ? ` (Correct: <span class="right">${correctAns}</span>)` : ''}
                            ${isCorrect ? ' ✅' : ' ❌'}
                        </div>
                        ${q.explanation ? `<div class="r-explain">💡 ${q.explanation}</div>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('reviewSection').scrollIntoView({ behavior: 'smooth' });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                nextQuestion();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                prevQuestion();
            } else if (e.key === 'Enter') {
                const submitBtn = document.getElementById('submitBtn');
                if (!submitBtn.disabled) submitBtn.click();
            }
        });

        loadTest();
    </script>
</body>
</html>
