<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepDOC - Weekly Tests</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f7ff; color: #1a1a2e; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 1.2rem; }
        
        .navbar {
            background: #ffffff;
            padding: 0.8rem 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eef2ff;
        }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        
        .logo { font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #1a1a2e; }
        .logo i { color: #0ea5e9; font-size: 1.8rem; }
        .logo span { color: #0ea5e9; }
        .logo .doc { background: #0ea5e9; color: white; padding: 2px 10px; border-radius: 30px; font-size: 0.7rem; margin-left: 4px; }
        
        .nav-links { display: flex; gap: 1.8rem; font-weight: 600; font-size: 0.95rem; align-items: center; transition: all 0.3s ease; }
        .nav-links a { color: #64748b; text-decoration: none; transition: color 0.2s; padding: 0.5rem 0; }
        .nav-links a:hover, .nav-links a.active { color: #0ea5e9; }
        
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
            background: none;
            border: none;
        }
        .hamburger span { display: block; width: 28px; height: 3px; background: #1a1a2e; border-radius: 3px; transition: all 0.3s ease; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }
        
        .page-header {
            background: linear-gradient(135deg, #fce7f3, #f9a8d4);
            padding: 2.5rem 0 2rem;
            text-align: center;
            border-bottom: 3px solid #ec4899;
        }
        .page-header h1 { font-size: 2.5rem; font-weight: 800; color: #be185d; }
        .page-header p { color: #831843; font-size: 1.1rem; margin-top: 0.3rem; }
        .page-header .back-home { display: inline-block; margin-top: 1rem; color: #be185d; font-weight: 600; text-decoration: none; }
        .page-header .back-home:hover { text-decoration: underline; }
        
        .section { padding: 2.5rem 0; }
        .section-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: #db2777; }
        
        .weekly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
        }
        .weekly-card {
            background: #fff;
            border-radius: 14px;
            padding: 1.5rem;
            border: 3px solid #f9a8d4;
            transition: all 0.3s ease;
        }
        .weekly-card:hover {
            border-color: #db2777;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(219, 39, 119, 0.10);
        }
        .weekly-card .test-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }
        .weekly-card .test-name { font-weight: 700; font-size: 1.1rem; }
        .weekly-card .test-badge {
            font-size: 0.7rem;
            background: #fce7f3;
            color: #db2777;
            padding: 2px 12px;
            border-radius: 50px;
            font-weight: 600;
        }
        .weekly-card .test-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: #64748b;
            margin: 0.5rem 0;
            flex-wrap: wrap;
        }
        .weekly-card .test-chapters {
            font-size: 0.85rem;
            color: #475569;
            margin: 0.5rem 0;
        }
        .weekly-card .test-chapters .ch-tag {
            display: inline-block;
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.7rem;
            margin: 2px;
            color: #1e293b;
        }
        .weekly-card .card-footer {
            margin-top: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .weekly-card .free-tag { color: #16a34a; font-weight: 700; }
        
        .btn {
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: #db2777; color: #fff; }
        .btn-primary:hover { background: #be185d; transform: scale(1.02); }
        .btn-outline { background: transparent; border: 2px solid #db2777; color: #db2777; }
        .btn-outline:hover { background: #db2777; color: #fff; }
        
        .footer {
            background: #0f172a;
            color: #94a3b8;
            padding: 2rem 0;
            text-align: center;
            margin-top: 1.5rem;
        }
        .footer .container { display: flex; flex-direction: column; gap: 0.8rem; }
        .footer-links { display: flex; gap: 1.8rem; justify-content: center; flex-wrap: wrap; }
        .footer-links a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
        .footer-links a:hover { color: #fff; }
        .footer-copy { font-size: 0.8rem; color: #64748b; }
        .footer .brand { color: #0ea5e9; font-weight: 700; }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
        }
        .loading i { font-size: 2rem; display: block; margin-bottom: 1rem; }
        
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
        }
        .empty-state i { font-size: 3rem; display: block; margin-bottom: 1rem; color: #dbeafe; }
        
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                gap: 0;
                padding: 1rem 0;
                border-top: 1px solid #eef2ff;
                margin-top: 0.8rem;
            }
            .nav-links.active { display: flex; }
            .nav-links a { padding: 0.8rem 0; width: 100%; text-align: center; border-bottom: 1px solid #f1f5f9; }
            .nav-links a:last-child { border-bottom: none; }
            .page-header h1 { font-size: 1.8rem; }
            .weekly-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .page-header h1 { font-size: 1.5rem; }
            .weekly-card .card-footer { flex-direction: column; align-items: stretch; }
            .weekly-card .card-footer .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-heartbeat"></i> Prep<span>DOC</span>
                <span class="doc">NEET</span>
            </div>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="chapterwise.html">Chapterwise</a>
                <a href="weekly.html" class="active">Weekly</a>
                <a href="fullsyllabus.html">Full Syllabus</a>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>📅 Weekly Test Series</h1>
            <p>Dynamic weekly tests created by your teachers</p>
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="section-title">
                <i class="fas fa-calendar-alt"></i> Available Weekly Tests
                <span class="tag" id="testCount" style="font-size:0.7rem;background:#fce7f3;color:#db2777;padding:2px 14px;border-radius:50px;font-weight:600;margin-left:auto;">Loading...</span>
            </div>

            <div id="weeklyGrid" class="weekly-grid">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading tests...</div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="chapterwise.html">Chapterwise</a>
                <a href="weekly.html">Weekly</a>
                <a href="fullsyllabus.html">Full Syllabus</a>
            </div>
            <div class="footer-copy">
                <span class="brand">🩺 PrepDOC</span> · Made for future doctors ❤️ · 100% Free
            </div>
        </div>
    </footer>

    <script>
        const API_BASE = 'https://prepdoc-y4k3.onrender.com';

        // ============================================
        // ===== LOAD WEEKLY TESTS FROM DATABASE =====
        // ============================================
        async function loadWeeklyTests() {
            try {
                console.log('🔄 Loading weekly tests...');
                const response = await fetch(`${API_BASE}/api/tests/weekly`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const tests = await response.json();
                console.log('📦 Weekly tests:', tests);
                
                const grid = document.getElementById('weeklyGrid');
                const countBadge = document.getElementById('testCount');
                
                if (!tests || tests.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-calendar-plus"></i>
                            <h3>No Weekly Tests Available</h3>
                            <p style="color:#94a3b8;margin-top:0.5rem;">Check back later or contact your teacher.</p>
                            ${localStorage.getItem('token') ? 
                                `<a href="admin.html" style="display:inline-block;margin-top:1rem;color:#db2777;font-weight:600;">📝 Go to Admin Panel to create tests</a>` : 
                                ''}
                        </div>
                    `;
                    countBadge.textContent = '0 Tests';
                    return;
                }

                countBadge.textContent = `${tests.length} Tests`;

                grid.innerHTML = tests.map(test => `
                    <div class="weekly-card">
                        <div class="test-header">
                            <div>
                                <div class="test-name">${test.title}</div>
                                <span class="test-badge">📅 Weekly</span>
                            </div>
                            <span style="font-size:0.8rem;color:#64748b;">⏱️ ${test.duration || 'N/A'}</span>
                        </div>
                        <div class="test-meta">
                            <span><i class="far fa-question-circle"></i> ${test.question_count || 0} Questions</span>
                            <span><i class="fas fa-tag"></i> ${test.subject || 'All Subjects'}</span>
                            ${test.created_at ? `<span><i class="far fa-calendar-alt"></i> ${new Date(test.created_at).toLocaleDateString('en-IN')}</span>` : ''}
                        </div>
                        ${test.chapters && test.chapters.length > 0 ? `
                            <div class="test-chapters">
                                📚 Chapters: 
                                ${test.chapters.map(ch => `<span class="ch-tag">${ch.name}</span>`).join('')}
                            </div>
                        ` : ''}
                        <div class="card-footer">
                            <span class="free-tag"><i class="fas fa-gift"></i> Free</span>
                            <button class="btn btn-primary" onclick="startTest(${test.id})">
                                <i class="fas fa-play"></i> Attempt Test
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('❌ Error loading weekly tests:', err);
                document.getElementById('weeklyGrid').innerHTML = `
                    <div class="empty-state" style="color:#dc2626;">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Error Loading Tests</h3>
                        <p style="color:#64748b;margin-top:0.5rem;">${err.message}</p>
                        <button class="btn btn-primary" onclick="loadWeeklyTests()" style="margin-top:1rem;">
                            <i class="fas fa-sync"></i> Retry
                        </button>
                    </div>
                `;
                document.getElementById('testCount').textContent = 'Error';
            }
        }

        // ============================================
        // ===== START TEST =====
        // ============================================
        async function startTest(testId) {
            try {
                // Check if user is logged in
                const token = localStorage.getItem('token');
                if (!token) {
                    alert('Please login first to attempt the test.');
                    window.location.href = 'login.html';
                    return;
                }

                // Fetch test details
                const response = await fetch(`${API_BASE}/api/tests/${testId}/with-chapters`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const test = await response.json();
                console.log('📝 Test details:', test);
                
                // Store test info in sessionStorage
                sessionStorage.setItem('weeklyTestId', testId);
                sessionStorage.setItem('weeklyTestName', test.title);
                sessionStorage.setItem('weeklyTestDuration', test.duration || '30m');
                
                // Redirect to test page
                window.location.href = `test.html?id=${testId}`;
            } catch (err) {
                console.error('❌ Error starting test:', err);
                alert(`Error starting test: ${err.message}`);
            }
        }

        // ============================================
        // ===== HAMBURGER MENU =====
        // ============================================
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', function() {
            this.classList.toggle('active');
            navLinks.classList.toggle('active');
        });
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', function() {
                hamburger.classList.remove('active');
                navLinks.classList.remove('active');
            });
        });

        // ============================================
        // ===== LOAD ON PAGE LOAD =====
        // ============================================
        loadWeeklyTests();
    </script>
</body>
</html>
