<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - PrepDOC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .signup-container {
            background: #ffffff;
            border-radius: 24px;
            padding: 2.5rem 2.8rem;
            max-width: 460px;
            width: 100%;
            border: 3px solid #dbeafe;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            transition: border-color 0.3s ease;
        }
        .signup-container:hover {
            border-color: #0ea5e9;
        }

        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            color: #1a1a2e;
        }
        .logo i {
            color: #0ea5e9;
        }
        .logo span {
            color: #0ea5e9;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            border-left: 4px solid #dc2626;
        }
        .error.show {
            display: block;
        }

        .success {
            background: #dcfce7;
            color: #15803d;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            border-left: 4px solid #15803d;
        }
        .success.show {
            display: block;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: #1a1a2e;
        }
        .form-group label .required {
            color: #dc2626;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: 0.3s ease;
            background: #f8fafc;
            outline: none;
        }
        .form-group input:focus {
            border-color: #0ea5e9;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }
        .form-group input::placeholder {
            color: #94a3b8;
        }
        .form-group input.error-input {
            border-color: #dc2626;
            background: #fef2f2;
        }

        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 3rem;
        }
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: color 0.2s;
        }
        .password-toggle:hover {
            color: #0ea5e9;
        }

        .password-strength {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .password-strength .bar {
            flex: 1;
            height: 4px;
            border-radius: 10px;
            background: #e2e8f0;
            transition: background 0.3s ease;
        }
        .password-strength .bar.weak {
            background: #dc2626;
        }
        .password-strength .bar.medium {
            background: #f59e0b;
        }
        .password-strength .bar.strong {
            background: #16a34a;
        }

        .password-hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 0.85rem;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
            background: #0ea5e9;
            color: #fff;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
        }
        .btn:hover {
            background: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.35);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: #64748b;
        }
        .login-link a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .login-link a:hover {
            color: #0284c7;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 2rem 1.5rem;
            }
            .logo {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="logo">
            <i class="fas fa-heartbeat"></i> Prep<span>DOC</span>
        </div>
        <p class="subtitle">Create your free account and start preparing!</p>

        <div class="error" id="errorMsg">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>
        <div class="success" id="successMsg">
            <i class="fas fa-check-circle"></i>
            <span id="successText"></span>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="name" placeholder="Your Name" required autofocus />
            </div>

            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" />
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-strength" id="passwordStrength">
                    <span class="bar" id="strengthBar1"></span>
                    <span class="bar" id="strengthBar2"></span>
                    <span class="bar" id="strengthBar3"></span>
                </div>
                <div class="password-hint" id="passwordHint">Password must be at least 6 characters</div>
            </div>

            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
                    <button type="button" class="password-toggle" id="confirmToggle" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn" id="signupBtn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        // ✅ CORRECT API_BASE - NO /api at the end!
        const API_BASE = 'https://prepdoc-y4k3.onrender.com';

        console.log('🔍 API_BASE:', API_BASE);

        // ============================================
        // ===== PASSWORD TOGGLE =====
        // ============================================
        document.getElementById('passwordToggle').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('confirmToggle').addEventListener('click', function() {
            const passwordInput = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // ============================================
        // ===== PASSWORD STRENGTH =====
        // ============================================
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const bar1 = document.getElementById('strengthBar1');
            const bar2 = document.getElementById('strengthBar2');
            const bar3 = document.getElementById('strengthBar3');
            const hint = document.getElementById('passwordHint');

            bar1.className = 'bar';
            bar2.className = 'bar';
            bar3.className = 'bar';

            if (password.length === 0) {
                hint.textContent = 'Password must be at least 6 characters';
                return;
            }

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            if (strength <= 2) {
                bar1.className = 'bar weak';
                hint.textContent = 'Weak password';
            } else if (strength <= 4) {
                bar1.className = 'bar medium';
                bar2.className = 'bar medium';
                hint.textContent = 'Medium password';
            } else {
                bar1.className = 'bar strong';
                bar2.className = 'bar strong';
                bar3.className = 'bar strong';
                hint.textContent = 'Strong password!';
            }
        });

        // ============================================
        // ===== SIGNUP FORM - FIXED API URL =====
        // ============================================
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const errorEl = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const successEl = document.getElementById('successMsg');
            const successText = document.getElementById('successText');

            errorEl.classList.remove('show');
            successEl.classList.remove('show');
            errorText.textContent = '';
            successText.textContent = '';

            // Validation
            if (!name || !email || !password || !confirmPassword) {
                errorText.textContent = 'Please fill in all fields';
                errorEl.classList.add('show');
                return;
            }

            if (password.length < 6) {
                errorText.textContent = 'Password must be at least 6 characters';
                errorEl.classList.add('show');
                return;
            }

            if (password !== confirmPassword) {
                errorText.textContent = 'Passwords do not match';
                errorEl.classList.add('show');
                return;
            }

            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

            try {
                // ✅ FIX: Correct API endpoint with /api/
                const url = `${API_BASE}/api/signup`;
                console.log('📡 Sending signup request to:', url);
                console.log('📧 Email:', email);
                console.log('👤 Name:', name);

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                console.log('📥 Response status:', response.status);
                const data = await response.json();
                console.log('📦 Response data:', data);

                if (response.ok) {
                    successText.textContent = '✅ Account created successfully! Redirecting...';
                    successEl.classList.add('show');

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    errorText.textContent = data.error || 'Signup failed. Please try again.';
                    errorEl.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                }
            } catch (err) {
                console.error('❌ Error:', err);
                errorText.textContent = 'Server error. Please make sure backend is running.';
                errorEl.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });

        // ============================================
        // ===== CONFIRM PASSWORD REAL-TIME CHECK =====
        // ============================================
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirm = this.value;

            if (confirm.length > 0 && password !== confirm) {
                this.style.borderColor = '#dc2626';
                this.style.background = '#fef2f2';
            } else if (confirm.length > 0 && password === confirm) {
                this.style.borderColor = '#16a34a';
                this.style.background = '#f0fdf4';
            } else {
                this.style.borderColor = '#e2e8f0';
                this.style.background = '#f8fafc';
            }
        });
    </script>

</body>
</html>
