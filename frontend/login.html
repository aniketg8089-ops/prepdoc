<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - PrepDOC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        /* ===== LOGIN CONTAINER ===== */
        .login-container {
            background: #ffffff;
            border-radius: 24px;
            padding: 2.5rem 2.8rem;
            max-width: 440px;
            width: 100%;
            border: 3px solid #dbeafe;  /* ✅ Fixed Outline */
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            transition: border-color 0.3s ease;
        }
        .login-container:hover {
            border-color: #0ea5e9;  /* ✅ Hover par border change */
        }

        /* ===== LOGO ===== */
        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            color: #1a1a2e;
        }
        .logo i {
            color: #0ea5e9;
        }
        .logo span {
            color: #0ea5e9;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        /* ===== ERROR MESSAGE ===== */
        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            border-left: 4px solid #dc2626;
        }
        .error.show {
            display: block;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: #1a1a2e;
        }
        .form-group label .required {
            color: #dc2626;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: 0.3s ease;
            background: #f8fafc;
            outline: none;
        }
        .form-group input:focus {
            border-color: #0ea5e9;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }
        .form-group input::placeholder {
            color: #94a3b8;
        }

        /* ===== PASSWORD TOGGLE ===== */
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 3rem;
        }
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: color 0.2s;
        }
        .password-toggle:hover {
            color: #0ea5e9;
        }

        /* ===== BUTTONS ===== */
        .btn {
            width: 100%;
            padding: 0.85rem;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
            background: #0ea5e9;
            color: #fff;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
        }
        .btn:hover {
            background: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.35);
        }
        .btn:active {
            transform: translateY(0);
        }

        /* ===== LINKS ===== */
        .signup-link {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: #64748b;
        }
        .signup-link a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .signup-link a:hover {
            color: #0284c7;
            text-decoration: underline;
        }

        .demo-info {
            text-align: center;
            margin-top: 1rem;
            padding: 0.8rem;
            background: #f1f5f9;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #475569;
            border: 2px dashed #dbeafe;
        }
        .demo-info strong {
            color: #0ea5e9;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }
            .logo {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo -->
        <div class="logo">
            <i class="fas fa-heartbeat"></i> Prep<span>DOC</span>
        </div>
        <p class="subtitle">Welcome back! Login to continue your preparation</p>

        <!-- Error Message -->
        <div class="error" id="errorMsg">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" placeholder="demo@prepdoc.com" required autofocus />
            </div>

            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required />
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <!-- Links -->
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>

        <div class="demo-info">
            <i class="fas fa-info-circle"></i>
            Demo: <strong>demo@prepdoc.com</strong> / <strong>password123</strong>
        </div>
    </div>

    <script>
        const API_BASE = 'https://prepdoc-y4k3.onrender.com';

        // ===== PASSWORD TOGGLE =====
        document.getElementById('passwordToggle').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // ===== LOGIN FORM =====
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');

            errorEl.classList.remove('show');
            errorText.textContent = '';

            if (!email || !password) {
                errorText.textContent = 'Please fill in all fields';
                errorEl.classList.add('show');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    errorText.textContent = data.error || 'Login failed. Please try again.';
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorText.textContent = 'Server error. Please make sure backend is running.';
                errorEl.classList.add('show');
            }
        });

        // ===== ENTER KEY SUPPORT =====
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>

</body>
</html>
